about:
  uk: |-
    Я — співзасновник і основний розробник Antonov Digital. Працюю разом із партнером Артемом Антоновим: він відповідає за менеджмент, маркетинг, залучення клієнтів і також бере участь в окремих задачах розробки.

    Ми створюємо практичні цифрові рішення під бізнес-задачі: AI-агентів, автоматизації, Telegram-ботів, CRM та внутрішні інструменти, сайти й MVP, системи збору та обробки даних, AI-контент і аудіообробку.

    Беремо задачу від аналізу до запуску: уточнюємо потрібний результат, пропонуємо реалістичний план, розробляємо, тестуємо, інтегруємо та допомагаємо з розгортанням. Можемо почати з невеликого етапу або MVP, щоб швидко перевірити підхід і не роздувати бюджет.

    У нашому досвіді — сайти й системи заявок для стоматологій та локального бізнесу, Telegram-боти для заявок і контенту, AI-агент пошуку та порівняння постачальників, Gmail/Telegram агент для аналізу проєктів, автоматизації, SEO/GEO та пайплайн очищення аудіокниг.

    Працюємо українською, англійською та російською. У повідомленні достатньо вказати, що має бути на виході, бажані строки та що вже підготовлено — запропонуємо конкретний план реалізації.
  en: |-
    I am a co-founder and the primary developer at Antonov Digital. I work together with my partner Artem Antonov, who handles management, marketing, client acquisition, and selected development tasks.

    We build practical digital solutions around real business needs: AI agents, workflow automation, Telegram bots, CRM and internal tools, websites and MVPs, data collection and processing systems, AI content, and audio-processing pipelines.

    We can take a task from analysis to launch: clarify the expected result, propose a realistic plan, build, test, integrate, and help deploy it. For uncertain scopes, we can begin with a small milestone or MVP to validate the approach without inflating the budget.

    Our work includes websites and lead systems for dental and local businesses, Telegram bots for leads and content, an AI supplier-search and comparison agent, a Gmail/Telegram project-analysis agent, automation, SEO/GEO work, and an audiobook-cleaning pipeline.

    We communicate in Ukrainian, English, and Russian. Send the expected deliverable, preferred timeline, and what is already available, and we will propose a concrete implementation plan.

