about:
  uk: |-
    Я — засновниця Antonov Digital і власниця цього профілю. Відповідаю за клієнтську та операційну частину: комунікацію, організацію роботи, домовленості, договори та оплату.

    Технічну реалізацію виконує команда Antonov Digital. Артем Антонов — співзасновник і партнер: менеджмент, маркетинг, залучення клієнтів і окремі задачі розробки. Вадим — розробник, який відповідає за основну технічну реалізацію.

    Ми беремо онлайн-задачі під конкретний результат: AI-агенти та інтеграції, автоматизації, Telegram-боти, CRM і внутрішні системи, сайти та MVP, API, парсинг і моніторинг, AI-контент, аудіообробку, SEO/GEO та Google Business Profile.

    Працюємо від аналізу до запуску: уточнюємо результат, пропонуємо реалістичний план і вартість за проєкт або етап, розробляємо, тестуємо, інтегруємо та допомагаємо з розгортанням. За потреби починаємо з невеликого milestone або MVP, щоб швидко перевірити підхід і не роздувати бюджет.

    У портфоліо — сайти й системи заявок для стоматологій та локального бізнесу, Telegram-боти для заявок і контенту, AI-агент пошуку та порівняння постачальників, Gmail/Telegram агент для аналізу проєктів, автоматизації, SEO/GEO, внутрішні бізнес-інструменти та пайплайн очищення аудіокниг.

    Працюємо українською, російською та англійською. Польською підтримуємо письмову комунікацію з AI-допомогою. У повідомленні достатньо вказати очікуваний результат, бажаний строк і що вже підготовлено — запропонуємо конкретний план реалізації.
  en: |-
    I am the founder of Antonov Digital and the owner of this profile. I handle client communication, work coordination, agreements, contracts, and payments.

    Technical delivery is handled by the Antonov Digital team. Artem Antonov is a co-founder and partner responsible for management, marketing, client acquisition, and selected development tasks. Vadim is the developer responsible for the main technical implementation.

    We take on online work tied to a concrete deliverable: AI agents and integrations, workflow automation, Telegram bots, CRM and internal tools, websites and MVPs, APIs, scraping and monitoring, AI content, audio processing, SEO/GEO, and Google Business Profile work.

    We can take a task from analysis to launch: clarify the expected result, propose a realistic project or milestone price, build, test, integrate, and help deploy it. For uncertain scopes, we can start with a small milestone or MVP to validate the approach without inflating the budget.

    Our portfolio includes websites and lead systems for dental and local businesses, Telegram bots for leads and content, an AI supplier-search and comparison agent, a Gmail/Telegram project-analysis agent, automation, SEO/GEO, internal business tools, and an audiobook-cleaning pipeline.

    We communicate in Ukrainian, Russian, and English. Polish written communication is supported with AI assistance. Send the expected deliverable, preferred timeline, and what is already available, and we will propose a concrete implementation plan.

