portfolio_gate:
  publish_only_when:
    - "Antonov Digital's exact role is documented"
    - "case description is factual"
    - "required screenshots or media exist"
    - "live link or sanitized demo works when one is claimed"
    - "no unsupported outcome metric is used"
  otherwise: "Defer the item and list the missing assets in the local profile setup report."

claims_policy:
